name: Refresh NYC restaurant directory
on:
  push:
    paths: ["tools/build_directory.py", ".github/workflows/directory.yml"]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_directory.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nyc-directory.json
          git diff --cached --quiet || git commit -m "Refresh NYC restaurant directory"
          git push
